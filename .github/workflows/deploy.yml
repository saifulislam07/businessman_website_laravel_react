name: CI and deploy

# Pull requests: run the backend tests and lint/type-check the frontend.
# Pushes to main: also build the frontend (which prerenders against the live API), then deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, exif, gd, intl, bcmath, zip, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: ./vendor/bin/pest

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b

      # The production build prerenders the page from the live API (it fails if the API is
      # unreachable), so it only runs where secrets exist: pushes to main and manual runs.
      - name: Build and prerender
        if: github.event_name != 'pull_request'
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          CHROME_PATH: /usr/bin/google-chrome

      - name: Upload build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to server
    needs: [backend-tests, frontend-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${SSH_HOST}
            User ${SSH_USER}
            Port ${SSH_PORT}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      # Backend first, so the API already serves any new fields when visitors get the new site.
      - name: Deploy backend
        run: ssh deploy-target 'bash /var/www/portfolio/deploy/deploy-backend.sh'

      - name: Upload frontend
        run: |
          rsync -az --delete dist/ deploy-target:/var/www/frontend/dist_new/
          ssh deploy-target 'set -e; cd /var/www/frontend; rm -rf dist_old; [ -d dist ] && mv dist dist_old; mv dist_new dist; rm -rf dist_old'

      - name: Smoke test
        env:
          SITE_URL: ${{ secrets.VITE_SITE_URL }}
          API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          curl -fsS -o /dev/null "$SITE_URL/"
          curl -fsS "$API_URL/home" | grep -q '"settings"'
