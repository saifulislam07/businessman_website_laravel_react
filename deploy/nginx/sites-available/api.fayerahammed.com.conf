# api.fayerahammed.com : Laravel API + Filament admin (/admin).
# Install to /etc/nginx/sites-available/api.fayerahammed.com.conf and symlink into sites-enabled.
# /var/www/backend is a symlink to /var/www/fayerahammed/backend (see SERVER-SETUP.md).

server {
    listen 80;
    listen [::]:80;
    server_name api.fayerahammed.com;
    return 301 https://api.fayerahammed.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.fayerahammed.com;

    ssl_certificate     /etc/ssl/cloudflare/fayerahammed.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/fayerahammed.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include snippets/cloudflare-realip.conf;

    root /var/www/backend/public;
    index index.php;
    charset utf-8;

    access_log /var/log/nginx/api.fayerahammed.com.access.log;
    error_log  /var/log/nginx/api.fayerahammed.com.error.log;

    # Admin uploads are limited to 5 MB per image; leave headroom for the form.
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript
               application/xml image/svg+xml;

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # Uploaded images (public/storage -> storage/app/public). Served by nginx, never by PHP.
    location ^~ /storage/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/fayer-security-headers.conf;
    }

    # Filament / Livewire published assets.
    location ~* \.(?:css|js|map|woff2?|svg|png|jpe?g|webp|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        include snippets/fayer-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only index.php is executed; any other .php request is a 404.
    location = /index.php {
        limit_req zone=fayer_api burst=40 nodelay;

        include snippets/fayer-security-headers.conf;
        add_header Content-Security-Policy $fayer_api_csp always;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }
}
