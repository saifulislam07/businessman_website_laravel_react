# example.com : static React site (built and uploaded by CI to /var/www/frontend/dist).
# Install to /etc/nginx/sites-available/example.com.conf and symlink into sites-enabled.
#
# TLS: Cloudflare "Full (strict)" with a Cloudflare Origin CA certificate stored on this server.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

# www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.com;

    ssl_certificate     /etc/ssl/cloudflare/example.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/example.com.key;

    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/ssl/cloudflare/example.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include snippets/cloudflare-realip.conf;

    root /var/www/frontend/dist;
    index index.html;

    access_log /var/log/nginx/example.com.access.log;
    error_log  /var/log/nginx/example.com.error.log;

    # Compression for text assets (Cloudflare adds Brotli for visitors).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript
               application/xml application/rss+xml image/svg+xml;

    # Never expose dotfiles.
    location ~ /\. {
        deny all;
        return 404;
    }

    # Hashed build output: cache for a year, never revalidate.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/portfolio-security-headers.conf;
        include snippets/portfolio-csp-frontend.conf;
    }

    # Other static files (favicon, og-image): cache for a month.
    location ~* \.(?:png|jpe?g|webp|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/portfolio-security-headers.conf;
        include snippets/portfolio-csp-frontend.conf;
    }

    # HTML, robots.txt, sitemap.xml: always revalidate. Unknown paths fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include snippets/portfolio-security-headers.conf;
        include snippets/portfolio-csp-frontend.conf;
    }
}
