# Content-Security-Policy for the React site (fayerahammed.com).
# Install to /etc/nginx/snippets/fayer-csp-frontend.conf
#
#  script-src      own files + Cloudflare Turnstile. No inline scripts exist (the prerendered page
#                  uses a JSON data block and an external loader), so no 'unsafe-inline'.
#  style-src-attr  allows style="" attributes (the page animates with inline styles); <style> and
#                  stylesheets must still come from this origin.
#  img-src         the API serves uploaded images; data: covers tiny inlined assets.
#  frame-src       Turnstile widget and the Google Maps embed.
#  connect-src     API calls and Turnstile.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: https://api.fayerahammed.com; font-src 'self'; connect-src 'self' https://api.fayerahammed.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
