# Security headers shared by every location of both sites.
# Install to /etc/nginx/snippets/fayer-security-headers.conf
#
# nginx does not inherit add_header from a parent block once a child block declares its own,
# so this file is included again inside each location that sets headers.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
