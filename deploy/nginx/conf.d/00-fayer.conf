# Shared http-level settings for fayerahammed.com and api.fayerahammed.com.
# Install to /etc/nginx/conf.d/00-fayer.conf

server_tokens off;

# Per-IP request limit for PHP requests on the API (Laravel adds its own, stricter, throttling).
limit_req_zone $binary_remote_addr zone=fayer_api:10m rate=20r/s;

# Content-Security-Policy for the JSON API only. The Filament admin (/admin) needs inline
# scripts, so it must not receive this header. An empty value means "do not send the header".
map $request_uri $fayer_api_csp {
    default "";
    ~^/api/ "default-src 'none'; frame-ancestors 'none'";
}
