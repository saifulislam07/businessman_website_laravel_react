; Laravel queue worker (contact-form emails). Install to /etc/supervisor/conf.d/portfolio-queue.conf
; then: sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl status
;
; --max-time restarts the worker every hour so it never serves stale code or leaks memory;
; `php artisan queue:restart` (run by deploy-backend.sh) also makes it exit after each deploy.

[program:portfolio-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/backend/artisan queue:work database --sleep=3 --tries=3 --timeout=90 --max-time=3600
directory=/var/www/backend
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=100
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/portfolio-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
